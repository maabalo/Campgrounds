<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path fill='%23EBF4DD' d='M8 1L1 14h14L8 1zm0 3l4.5 8h-9L8 4z'/><path fill='%2390AB8B' d='M8 4l2.5 8h-5L8 4z'/></svg>">
  <title>NextCamp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- ══ TOPBAR ══ -->
  <header class="topbar">
    <div class="topbar-brand">
      <h1 class="site-title">NextCamp</h1>
      <p class="site-subtitle">Discover Your Next Camp, One Adventure at a Time.</p>
    </div>
    <div class="topbar-actions">
      <div class="burger-float">
        <button id="burgerBtn" class="burger-btn" title="Admin Menu">
          <span></span><span></span><span></span>
        </button>
        <div class="burger-dropdown" id="burgerDropdown">
          <button id="adminLoginBtn" class="burger-item"
            onclick="document.getElementById('loginModalOverlay').classList.add('open'); document.getElementById('burgerDropdown').classList.remove('open');">
            ADMIN LOGIN
          </button>
          <button id="adminAddNewBtn" class="burger-item" style="display:none;">+ ADD NEW</button>
          <button id="adminLogoutBtn" class="burger-item burger-item-danger" style="display:none;">LOGOUT</button>
        </div>
      </div>
    </div>
  </header>

  <!-- ══ SEARCH BAR (3-section like reference) ══ -->
  <div class="searchbar">
    <div class="searchbar-section searchbar-main">
      <span class="searchbar-icon">⛺</span>
      <input type="text" id="searchInput" class="searchbar-input" placeholder="WHAT ARE YOU LOOKING FOR?">
    </div>
    <div class="searchbar-divider"></div>
    <div class="searchbar-section searchbar-province">
      <span class="searchbar-icon">📍</span>
      <div class="custom-dropdown" id="customDropdown">
        <button class="dropdown-trigger" id="dropdownTrigger">
          <span id="selectedOptionText">ALL PROVINCES</span>
          <span class="arrow">▼</span>
        </button>
        <div class="dropdown-menu" id="dropdownMenu"></div>
      </div>
    </div>
    <div class="searchbar-divider"></div>

    <!-- FIX 2: Camping Style multi-select dropdown -->
    <div class="searchbar-section searchbar-style">
      <span class="searchbar-icon">🏕️</span>
      <div class="custom-dropdown" id="campingStyleDropdown">
        <button class="dropdown-trigger" id="campingStyleTrigger">
          <span id="campingStyleText">SELECT CAMPING STYLE</span>
          <span class="arrow">▼</span>
        </button>
        <div class="dropdown-menu camping-style-menu" id="campingStyleMenu">
          <label class="dropdown-check-item"><input type="checkbox" data-amenity="carCamping"> CAR CAMP</label>
          <label class="dropdown-check-item"><input type="checkbox" data-amenity="motorCamping"> MOTOR CAMP</label>
          <label class="dropdown-check-item"><input type="checkbox" data-amenity="tentOnly"> TENT</label>
          <label class="dropdown-check-item"><input type="checkbox" data-amenity="hammock"> HAMMOCK</label>
          <label class="dropdown-check-item"><input type="checkbox" data-amenity="forest"> FOREST</label>
          <label class="dropdown-check-item"><input type="checkbox" data-amenity="mountain"> MOUNTAIN</label>
          <label class="dropdown-check-item"><input type="checkbox" data-amenity="river"> RIVER</label>
          <label class="dropdown-check-item"><input type="checkbox" data-amenity="beach"> BEACH</label>
          <label class="dropdown-check-item"><input type="checkbox" data-amenity="hiking"> HIKING</label>
          <label class="dropdown-check-item"><input type="checkbox" data-amenity="trail"> TRAIL</label>
          <label class="dropdown-check-item"><input type="checkbox" data-amenity="wifi"> WI-FI</label>
          <label class="dropdown-check-item"><input type="checkbox" data-amenity="pisoWifi"> PISO WI-FI</label>
          <label class="dropdown-check-item"><input type="checkbox" data-amenity="restroom"> RESTROOM</label>
          <label class="dropdown-check-item"><input type="checkbox" data-amenity="electricity"> POWER</label>
          <label class="dropdown-check-item"><input type="checkbox" data-amenity="parking"> PARKING</label>
          <label class="dropdown-check-item"><input type="checkbox" data-amenity="trees"> TREES</label>
          <label class="dropdown-check-item"><input type="checkbox" data-amenity="signal"> SIGNAL</label>
        </div>
      </div>
    </div>
  </div>

  <!-- ══ BODY: Sidebar + Cards ══ -->
  <div class="page-body">

    <!-- LEFT SIDEBAR -->
    <aside class="sidebar">

      <!-- FIX 3: Add Campsite button at top of sidebar -->
      <div class="sidebar-section">
        <button id="suggestBtn" class="sidebar-suggest-btn">+ ADD CAMPSITE</button>
      </div>

      <!-- FIX 5: Legend toggle — fixed with inline JS -->
      <div class="sidebar-section">
        <button id="legendToggleBtn" class="sidebar-toggle-btn">
          ICON LEGEND <span class="arrow">▼</span>
        </button>
        <div class="legend-wrapper" id="legendWrapper">
          <div id="legendGrid" class="legend-grid"></div>
        </div>
      </div>

      <!-- Hidden filter-wrapper stub — keeps script.js happy -->
      <div class="filter-wrapper" id="filterWrapper" style="display:none;"></div>

      <!-- Province List -->
      <div class="sidebar-section">
        <div class="province-list" id="provinceList"></div>
      </div>

    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">

      <!-- Results bar -->
      <div class="results-bar">
        <p class="results-count" id="resultsCount"></p>
        <button id="sortBtn" class="sort-btn" data-sort="asc">SORT: A–Z</button>
      </div>

      <!-- Card Grid -->
      <div class="card-grid" id="cardGrid"></div>

      <!-- No Results -->
      <p id="noResults" class="no-results" style="display:none;">NO CAMPSITES FOUND.</p>

    </main>

  </div>

  <!-- ══ ADMIN LOGIN MODAL ══ -->
  <div class="modal-overlay" id="loginModalOverlay">
    <div class="modal-card" style="padding: 1.5rem; max-width: 380px;">
      <button class="modal-close" onclick="document.getElementById('loginModalOverlay').classList.remove('open')">X</button>
      <h2 class="modal-title" style="margin-bottom: 1rem;">ADMIN LOGIN</h2>
      <form id="loginForm" class="suggest-form">
        <div class="form-group">
          <label for="loginEmail" class="filter-label">EMAIL</label>
          <input type="email" id="loginEmail" class="pixel-input" required>
        </div>
        <div class="form-group">
          <label for="loginPass" class="filter-label">PASSWORD</label>
          <input type="password" id="loginPass" class="pixel-input" required>
        </div>
        <button type="submit" class="pixel-btn submit-btn" style="margin-top:0.5rem;width:100%;">LOGIN</button>
      </form>
    </div>
  </div>

  <!-- ══ CAMPSITE DETAIL MODAL ══ -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
      <button class="modal-close" id="modalClose">X</button>
      <div class="modal-image-wrapper">
        <img id="modalImg" src="" alt="Campground" class="modal-image">
      </div>
      <div class="modal-body">
        <h2 id="modalTitle" class="modal-title">CAMPSITE NAME</h2>
        <div class="modal-location-container">
          <div class="modal-location-chip">
            <svg class="pixel-icon" viewBox="0 0 16 16"><path d="M8 1a5 5 0 00-5 5c0 3.8 5 9 5 9s5-5.2 5-9a5 5 0 00-5-5zm0 7a2 2 0 110-4 2 2 0 010 4z"/></svg>
            <span id="modalLocText">PROVINCES</span>
          </div>
        </div>
        <p id="modalDesc" class="modal-description">Description goes here...</p>
        <div id="modalVisitContainer" class="modal-visit-container" style="display:none;">
          <p class="amenities-heading">GO VISIT:</p>
          <div class="modal-links-row">
            <a id="modalCampUrlLink" class="modal-map-link" href="#" target="_blank" rel="noopener noreferrer" style="display:none;">WEBSITE/PAGE ↗</a>
            <a id="modalMapLink" class="modal-map-link" href="#" target="_blank" rel="noopener noreferrer" style="display:none;">MAP ↗</a>
          </div>
        </div>
        <div class="amenities-container">
          <p class="amenities-heading">TAGS & FEATURES</p>
          <div id="amenitiesGrid" class="amenities-grid"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ══ ADD / EDIT MODAL ══ -->
  <div class="modal-overlay" id="editorModalOverlay">
    <div class="modal-card suggest-modal-card">
      <button class="modal-close" id="editorModalClose">X</button>
      <div class="modal-body">
        <h2 id="editorTitle" class="modal-title">EDIT CAMPSITE</h2>
        <form id="editorForm" class="suggest-form">
          <input type="hidden" id="editCampId">
          <div class="form-group">
            <label for="editName" class="filter-label">*NAME</label>
            <input type="text" id="editName" class="pixel-input" required>
          </div>
          <div class="form-group">
            <label for="editLoc" class="filter-label">*BARANGAY</label>
            <input type="text" id="editLoc" class="pixel-input" placeholder="e.g. BRGY. SIRAO" required>
          </div>
          <div class="form-group">
            <label for="editCountry" class="filter-label">*PROVINCES</label>
            <input type="text" id="editCountry" class="pixel-input" placeholder="e.g. CEBU, MANILA" required>
          </div>
          <div class="form-group">
            <label for="editCampUrl" class="filter-label">CAMPSITE LINK (OPTIONAL)</label>
            <input type="url" id="editCampUrl" class="pixel-input" placeholder="https://facebook.com/...">
          </div>
          <div class="form-group">
            <label for="editMapUrl" class="filter-label">*GOOGLE MAPS URL</label>
            <input type="url" id="editMapUrl" class="pixel-input" placeholder="https://maps.google.com/...">
          </div>
          <div class="form-group">
            <label class="filter-label">IMAGE SOURCE (OPTIONAL)</label>
            <div class="image-toggle-container">
              <button type="button" id="btnUploadMode" class="img-toggle-btn active">UPLOAD FILE</button>
              <button type="button" id="btnUrlMode" class="img-toggle-btn">IMAGE URL</button>
            </div>
            <div id="fileUploadSection">
              <input type="file" id="editImgFile" class="pixel-file-input" accept="image/*">
              <small class="helper-text">Auto-compressed &lt; 500KB</small>
            </div>
            <div id="urlUploadSection" style="display:none;">
              <input type="url" id="editImgUrl" class="pixel-input pixel-file-input" placeholder="https://example.com/photo.jpg">
              <small class="helper-text">Direct image URL (.jpg, .png, .webp)</small>
            </div>
            <div id="imagePreviewContainer" class="image-preview-container">
              <img id="editImgPreview" src="" alt="Preview">
            </div>
          </div>
          <div class="form-group">
            <label for="editDesc" class="filter-label">*DESCRIPTION</label>
            <textarea id="editDesc" class="pixel-textarea" rows="3" required></textarea>
          </div>
          <div class="form-group">
            <label class="filter-label">AMENITIES</label>
            <div class="checkbox-grid">
              <label><input type="checkbox" id="chkTrees"> TREES</label>
              <label><input type="checkbox" id="chkRestroom"> RESTROOM</label>
              <label><input type="checkbox" id="chkElectricity"> POWER</label>
              <label><input type="checkbox" id="chkWifi"> WI-FI</label>
              <label><input type="checkbox" id="chkPisoWifi"> PISO WI-FI</label>
              <label><input type="checkbox" id="chkSignal"> SIGNAL</label>
              <label><input type="checkbox" id="chkParking"> PARKING</label>
            </div>
          </div>
          <div class="form-group">
            <label class="filter-label">CAMPING STYLE</label>
            <div class="checkbox-grid">
              <label><input type="checkbox" id="chkCarCamping"> CAR CAMP</label>
              <label><input type="checkbox" id="chkMotorCamping"> MOTOR CAMP</label>
              <label><input type="checkbox" id="chkTentOnly"> TENT</label>
              <label><input type="checkbox" id="chkHammock"> HAMMOCK</label>
            </div>
          </div>
          <div class="form-group">
            <label class="filter-label">TERRAIN & ACTIVITIES</label>
            <div class="checkbox-grid">
              <label><input type="checkbox" id="chkForest"> FOREST</label>
              <label><input type="checkbox" id="chkMountain"> MOUNTAIN</label>
              <label><input type="checkbox" id="chkRiver"> RIVER</label>
              <label><input type="checkbox" id="chkBeach"> BEACH</label>
              <label><input type="checkbox" id="chkHiking"> HIKING</label>
              <label><input type="checkbox" id="chkTrail"> TRAIL</label>
            </div>
          </div>
          <div class="editor-actions">
            <button type="submit" id="saveSubmitBtn" class="pixel-btn submit-btn">SUBMIT</button>
            <button type="button" id="deleteBtn" class="pixel-btn delete-btn">DELETE</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script type="module" src="assets/js/script.js"></script>

</body>
</html>
