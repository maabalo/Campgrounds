<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campsite Directory</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <header class="app-header">
    <div class="admin-bar" style="text-align: right; margin-bottom: 1rem;">
      <button id="adminLoginBtn" class="pixel-btn" onclick="document.getElementById('loginModalOverlay').classList.add('open')">ADMIN LOGIN</button>
      <button id="adminAddNewBtn" class="pixel-btn" style="display:none; background-color: #2C5745; color: #EBE3A7;">+ ADD NEW</button>
      <button id="adminLogoutBtn" class="pixel-btn" style="display:none; background-color: #A94442; color: #FFF;">LOGOUT</button>
    </div>

    <div class="filter-controls">
      <input type="text" id="searchInput" placeholder="Search campsites...">
      <select id="locationSelect">
        <option value="">ALL LOCATIONS</option>
      </select>
      <button id="suggestBtn" class="box-suggest-btn">+ SUGGEST CAMPSITE</button>
    </div>
  </header>

  <main>
    <section id="cardGrid" class="card-grid"></section>
  </main>

  <!-- Login Modal -->
  <div id="loginModalOverlay" class="modal-overlay">
    <div class="modal-content">
      <h2>ADMIN LOGIN</h2>
      <form id="loginForm">
        <input type="email" id="loginEmail" placeholder="Email" required>
        <input type="password" id="loginPassword" placeholder="Password" required>
        <div class="modal-actions">
          <button type="submit" class="pixel-btn">LOGIN</button>
          <button type="button" class="pixel-btn" onclick="document.getElementById('loginModalOverlay').classList.remove('open')">CANCEL</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Campsite Detail Modal -->
  <div id="detailModalOverlay" class="modal-overlay">
    <div class="modal-content">
      <button id="closeDetailBtn" class="close-btn">&times;</button>
      <div id="detailModalContent"></div>
    </div>
  </div>

  <!-- Campsite Editor Modal -->
  <div id="editorModalOverlay" class="modal-overlay">
    <div class="modal-content">
      <button id="closeEditorBtn" class="close-btn">&times;</button>
      <h2 id="editorTitle">SUGGEST A CAMPSITE</h2>
      <form id="editorForm">
        <input type="hidden" id="editCampId">
        
        <label>Name:</label>
        <input type="text" id="editName" required>

        <label>Location Details:</label>
        <input type="text" id="editLoc" placeholder="e.g. Barangay Name" required>

        <label>Country / Region:</label>
        <input type="text" id="editCountry" placeholder="e.g. Philippines" required>

        <label>Website / Facebook URL:</label>
        <input type="url" id="editCampUrl">

        <label>Google Maps URL:</label>
        <input type="url" id="editMapUrl">

        <label>Image Source Mode:</label>
        <div class="image-mode-toggle">
          <button type="button" id="btnUploadMode" class="pixel-btn active">Upload File</button>
          <button type="button" id="btnUrlMode" class="pixel-btn">Image URL</button>
        </div>

        <div id="uploadInputGroup">
          <label>Image Upload:</label>
          <input type="file" id="editImgFile" accept="image/*">
        </div>

        <div id="urlInputGroup" style="display: none;">
          <label>Image URL:</label>
          <input type="url" id="editImgUrl" placeholder="https://example.com/image.jpg">
        </div>

        <div id="imagePreviewContainer" style="margin: 10rem 0; text-align: center;">
          <img id="imagePreview" src="" alt="Preview" style="max-width: 100%; max-height: 200px; display: none;">
        </div>

        <label>Description:</label>
        <textarea id="editDesc" rows="4"></textarea>

        <fieldset>
          <legend>Amenities</legend>
          <label><input type="checkbox" id="chkTrees"> Trees / Shade</label>
          <label><input type="checkbox" id="chkRestroom"> Restroom</label>
          <label><input type="checkbox" id="chkElectricity"> Electricity</label>
          <label><input type="checkbox" id="chkWifi"> Wi-Fi</label>
          <label><input type="checkbox" id="chkPisoWifi"> Piso Wi-Fi</label>
          <label><input type="checkbox" id="chkSignal"> Cellular Signal</label>
          <label><input type="checkbox" id="chkParking"> Parking</label>
        </fieldset>

        <fieldset>
          <legend>Camping Style</legend>
          <label><input type="checkbox" id="chkCarCamping"> Car Camping</label>
          <label><input type="checkbox" id="chkMotorCamping"> Motor Camping</label>
          <label><input type="checkbox" id="chkTentOnly"> Tent Only</label>
        </fieldset>

        <fieldset>
          <legend>Environment & Activities</legend>
          <label><input type="checkbox" id="chkForest"> Forest</label>
          <label><input type="checkbox" id="chkMountain"> Mountain</label>
          <label><input type="checkbox" id="chkRiver"> River</label>
          <label><input type="checkbox" id="chkBeach"> Beach</label>
          <label><input type="checkbox" id="chkHiking"> Hiking</label>
          <label><input type="checkbox" id="chkTrail"> Trail</label>
        </fieldset>

        <div class="editor-actions">
          <button type="submit" id="saveSubmitBtn" class="pixel-btn submit-btn">SUBMIT</button>
          <button type="button" id="deleteBtn" class="pixel-btn delete-btn">DELETE</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="assets/js/script.js"></script>
</body>
</html>
